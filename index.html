<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hello, Hot Weather · Ticket Booking</title>

<!-- PDF library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sun-1: #ff9a3c;
    --sun-2: #ff5f6d;
    --sand:  #ffd8a8;
    --dusk:  #1a0f2e;
    --dusk2: #2b1145;
    --card:  rgba(255, 255, 255, 0.06);
    --line:  rgba(255, 200, 130, 0.22);
    --txt:   #ffe9d6;
    --muted: #c9a4b8;
  }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 40px 16px 60px;
    color: var(--txt);
    background:
      radial-gradient(circle at 15% 0%,  rgba(255, 154, 60, 0.35), transparent 55%),
      radial-gradient(circle at 85% 10%, rgba(255, 95, 109, 0.30), transparent 55%),
      radial-gradient(circle at 50% 100%, rgba(120, 60, 180, 0.35), transparent 60%),
      linear-gradient(180deg, var(--dusk), var(--dusk2));
    background-attachment: fixed;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    top: -120px; right: -120px;
    width: 380px; height: 380px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,200,90,0.5), transparent 70%);
    filter: blur(20px);
    pointer-events: none;
    animation: float 8s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes float {
    0%,100% { transform: translateY(0)   scale(1);    }
    50%     { transform: translateY(20px) scale(1.05); }
  }

  header { position: relative; z-index: 1; text-align: center; margin-bottom: 36px; }

  header h1 {
    font-size: clamp(2rem, 6vw, 3.4rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, #ffd166, #ff8a3d 45%, #ff5f6d 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 6px 40px rgba(255, 140, 60, 0.35);
    margin-bottom: 10px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .subtitle::before, .subtitle::after {
    content: "☀"; margin: 0 10px; color: var(--sun-1); opacity: 0.7;
  }

  main { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }

  .stats {
    display: flex; gap: 16px; justify-content: center;
    margin-bottom: 32px; flex-wrap: wrap;
  }
  .stat {
    background: var(--card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px 36px;
    text-align: center;
    min-width: 130px;
    box-shadow: 0 8px 32px rgba(255, 120, 60, 0.12);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .stat:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(255,120,60,0.22); }
  .stat span {
    display: block; font-size: 2.2rem; font-weight: 800;
    background: linear-gradient(180deg, #ffd166, #ff7a3d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1.1;
  }
  .stat label {
    font-size: 0.7rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.15em;
    margin-top: 4px; display: inline-block;
  }

  .seats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(66px, 1fr));
    gap: 12px;
  }
  .seat {
    aspect-ratio: 1; border-radius: 16px;
    border: 1px solid var(--line);
    background: linear-gradient(145deg, rgba(255,220,160,0.14), rgba(255,140,90,0.06));
    color: var(--txt); font-weight: 700; font-size: 1rem;
    cursor: pointer; transition: all 0.18s ease;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    font-feature-settings: "tnum";
  }
  .seat:hover:not(:disabled) {
    background: linear-gradient(145deg, rgba(255,220,160,0.32), rgba(255,140,90,0.18));
    border-color: rgba(255, 200, 130, 0.55);
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 10px 24px rgba(255, 140, 60, 0.35);
  }
  .seat:active:not(:disabled) { transform: translateY(-1px) scale(0.98); }
  .seat.booked {
    background: rgba(60, 20, 40, 0.55);
    border-color: rgba(120, 40, 60, 0.5);
    color: #b06080; cursor: not-allowed;
    text-decoration: line-through; opacity: 0.6; box-shadow: none;
  }
  .seat.just-booked { animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes pop {
    0%   { transform: scale(1);    box-shadow: 0 0 0 0 rgba(255,120,60,0.6); }
    50%  { transform: scale(1.18); box-shadow: 0 0 0 12px rgba(255,120,60,0); }
    100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(255,120,60,0); }
  }

  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(140px);
    background: rgba(30, 15, 40, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    padding: 14px 28px; border-radius: 14px;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none; z-index: 100;
    font-weight: 600;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  .toast.show    { transform: translateX(-50%) translateY(0); }
  .toast.error   { border-color: #ff5f6d; color: #ffb3bb; box-shadow: 0 12px 40px rgba(255,95,109,0.3); }
  .toast.success { border-color: #4ade80; color: #b9f7cd; box-shadow: 0 12px 40px rgba(74,222,128,0.25); }

  footer {
    text-align: center; margin-top: 40px; color: var(--muted);
    font-size: 0.85rem; position: relative; z-index: 1;
  }
  footer .online  { color: #4ade80; }
  footer .offline { color: #ff5f6d; }

  /* ─────── MODAL ─────── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(10, 4, 20, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 200;
  }
  .modal-backdrop.show { opacity: 1; pointer-events: auto; }

  .modal {
    background: linear-gradient(160deg, #2a1442, #1a0f2e);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 32px 28px;
    width: 100%; max-width: 420px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,200,130,0.08);
    transform: scale(0.9) translateY(20px);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .modal-backdrop.show .modal { transform: scale(1) translateY(0); }

  .modal h2 {
    font-size: 1.5rem; font-weight: 800; margin-bottom: 6px;
    background: linear-gradient(90deg, #ffd166, #ff8a3d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .modal p {
    color: var(--muted); font-size: 0.9rem; margin-bottom: 22px;
  }
  .modal p b { color: #ffd166; font-weight: 700; }

  .modal label {
    display: block;
    font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--muted);
    margin-bottom: 8px;
  }
  .modal input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.05);
    color: var(--txt);
    font-size: 1rem;
    outline: none;
    transition: all 0.18s ease;
    font-family: inherit;
  }
  .modal input:focus {
    border-color: rgba(255, 180, 90, 0.7);
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 0 4px rgba(255, 140, 60, 0.15);
  }
  .modal input::placeholder { color: rgba(201, 164, 184, 0.5); }

  .modal-actions {
    display: flex; gap: 10px; margin-top: 22px;
  }

  .btn {
    flex: 1;
    padding: 14px 20px;
    border-radius: 12px;
    border: none;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.18s ease;
    font-family: inherit;
  }
  .btn-cancel {
    background: rgba(255,255,255,0.06);
    color: var(--muted);
    border: 1px solid var(--line);
  }
  .btn-cancel:hover { background: rgba(255,255,255,0.1); color: var(--txt); }

  .btn-confirm {
    background: linear-gradient(135deg, #ff9a3c, #ff5f6d);
    color: white;
    box-shadow: 0 8px 24px rgba(255, 120, 60, 0.35);
  }
  .btn-confirm:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255, 120, 60, 0.5); }
  .btn-confirm:active { transform: translateY(0); }
  .btn-confirm:disabled { opacity: 0.6; cursor: wait; transform: none; }
</style>
</head>
<body>

<header>
  <h1>Hello, Hot Weather</h1>
  <p class="subtitle">Ticket Booking</p>
</header>

<main>
  <div class="stats">
    <div class="stat"><span id="availableCount">50</span><label>Available</label></div>
    <div class="stat"><span id="bookedCount">0</span><label>Booked</label></div>
  </div>

  <div id="seats" class="seats-grid"></div>
  <div id="toast" class="toast"></div>
</main>

<footer><p id="status">Connecting…</p></footer>

<!-- ─────── NAME MODAL ─────── -->
<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <h2>Who's booking?</h2>
    <p>Ticket <b id="modalTicketNum">#—</b> · Enter your name to receive your PDF ticket.</p>

    <label for="nameInput">Full name</label>
    <input id="nameInput" type="text" placeholder="e.g. Ahmed Ali" autocomplete="name" maxlength="60" />

    <div class="modal-actions">
      <button class="btn btn-cancel" id="cancelBtn" type="button">Cancel</button>
      <button class="btn btn-confirm" id="confirmBtn" type="button">Book & Download</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, doc, onSnapshot, runTransaction,
  getDocs, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ─────────────────────────────────────────────────────────────
   ⬇️  PASTE YOUR FIREBASE CONFIG HERE  ⬇️
   Firebase Console → ⚙️ Project Settings → Your apps → </> Web
   ───────────────────────────────────────────────────────────── */
const firebaseConfig = {
  apiKey: "AIzaSyB7LwM1oNVjfjs2fgdd9OOASBqkDm7DkK0",
  authDomain: "ticket-d2f30.firebaseapp.com",
  projectId: "ticket-d2f30",
  storageBucket: "ticket-d2f30.firebasestorage.app",
  messagingSenderId: "225223962663",
  appId: "1:225223962663:web:4e8e118ede45defaf61e02"
};
/* ───────────────────────────────────────────────────────────── */

const TOTAL = 50;
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ticketsCol = collection(db, "tickets");

const seatsEl     = document.getElementById("seats");
const availableEl = document.getElementById("availableCount");
const bookedEl    = document.getElementById("bookedCount");
const statusEl    = document.getElementById("status");
const toastEl     = document.getElementById("toast");

const modalBackdrop  = document.getElementById("modalBackdrop");
const modalTicketNum = document.getElementById("modalTicketNum");
const nameInput      = document.getElementById("nameInput");
const cancelBtn      = document.getElementById("cancelBtn");
const confirmBtn     = document.getElementById("confirmBtn");

let toastTimer;
function showToast(msg, type = "success") {
  toastEl.textContent = msg;
  toastEl.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (toastEl.className = "toast"), 2800);
}

const pad = (n) => `T${String(n).padStart(3, "0")}`;

/* ─────── SEAT GRID ─────── */
const seatEls = new Map();
function buildGrid() {
  seatsEl.innerHTML = "";
  seatEls.clear();
  for (let i = 1; i <= TOTAL; i++) {
    const btn = document.createElement("button");
    btn.className = "seat";
    btn.textContent = i;
    btn.disabled = true;
    btn.addEventListener("click", () => openModal(i));
    seatsEl.appendChild(btn);
    seatEls.set(i, btn);
  }
}

function render(existingNumbers) {
  const existing = new Set(existingNumbers);
  let available = 0;
  for (let i = 1; i <= TOTAL; i++) {
    const btn = seatEls.get(i);
    if (existing.has(i)) {
      btn.classList.remove("booked");
      btn.disabled = false;
      available++;
    } else {
      if (!btn.classList.contains("booked")) {
        btn.classList.add("just-booked");
        setTimeout(() => btn.classList.remove("just-booked"), 500);
      }
      btn.classList.add("booked");
      btn.disabled = true;
    }
  }
  availableEl.textContent = available;
  bookedEl.textContent = TOTAL - available;
}

/* ─────── MODAL CONTROL ─────── */
let pendingTicket = null;

function openModal(number) {
  pendingTicket = number;
  modalTicketNum.textContent = `#${number}`;
  nameInput.value = "";
  confirmBtn.disabled = false;
  confirmBtn.textContent = "Book & Download";
  modalBackdrop.classList.add("show");
  setTimeout(() => nameInput.focus(), 250);
}

function closeModal() {
  modalBackdrop.classList.remove("show");
  pendingTicket = null;
}

cancelBtn.addEventListener("click", closeModal);
modalBackdrop.addEventListener("click", (e) => {
  if (e.target === modalBackdrop) closeModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modalBackdrop.classList.contains("show")) closeModal();
});

nameInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") confirmBtn.click();
});

confirmBtn.addEventListener("click", async () => {
  const name = nameInput.value.trim();
  if (!name) {
    nameInput.focus();
    nameInput.style.borderColor = "#ff5f6d";
    setTimeout(() => (nameInput.style.borderColor = ""), 900);
    return;
  }
  const number = pendingTicket;
  if (!number) return;

  confirmBtn.disabled = true;
  confirmBtn.textContent = "Booking…";

  try {
    await bookTicket(number, name);
    generatePDF(name, number);
    closeModal();
    showToast(`☀ Ticket #${number} booked — PDF downloading`, "success");
  } catch (err) {
    console.error(err);
    showToast(`✖ ${err.message}`, "error");
    confirmBtn.disabled = false;
    confirmBtn.textContent = "Book & Download";
  }
});

/* ─────── BOOKING (transaction = atomic delete) ─────── */
async function bookTicket(number, name) {
  const ref = doc(db, "tickets", pad(number));
  await runTransaction(db, async (tx) => {
    const snap = await tx.get(ref);
    if (!snap.exists()) throw new Error("Already booked");
    tx.delete(ref);
  });
  // store name locally for the PDF (not required in DB)
  console.log(`Ticket #${number} booked by ${name}`);
}

/* ─────── PDF GENERATION ─────── */
function generatePDF(name, number) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a5", orientation: "landscape" });

  const W = doc.internal.pageSize.getWidth();   // ~210mm for a5 landscape
  const H = doc.internal.pageSize.getHeight();  // ~148mm

  // Background gradient (simulated with two rects)
  doc.setFillColor(26, 15, 46);
  doc.rect(0, 0, W, H, "F");

  // Warm top band
  doc.setFillColor(255, 154, 60);
  doc.rect(0, 0, W, 3, "F");

  // ── Title
  doc.setTextColor(255, 209, 102);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(22);
  doc.text("Hello, Hot Weather", 15, 22);

  doc.setTextColor(201, 164, 184);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  doc.text("OFFICIAL EVENT TICKET", 15, 29);

  // Divider
  doc.setDrawColor(255, 200, 130);
  doc.setLineWidth(0.4);
  doc.line(15, 34, W - 15, 34);

  // ── Ticket number (big)
  doc.setTextColor(255, 138, 61);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(40);
  doc.text(`#${number}`, 15, 58);

  doc.setTextColor(201, 164, 184);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.text("TICKET NUMBER", 15, 64);

  // ── Name
  doc.setTextColor(255, 233, 214);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(16);
  doc.text(name, 15, 82);

  doc.setTextColor(201, 164, 184);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.text("ATTENDEE", 15, 88);

  // ── Right side: dashed stub
  const stubX = W - 60;
  doc.setDrawColor(120, 80, 130);
  doc.setLineDashPattern([2, 2], 0);
  doc.line(stubX, 40, stubX, H - 15);
  doc.setLineDashPattern([], 0);

  doc.setTextColor(201, 164, 184);
  doc.setFontSize(8);
  doc.text("ADMIT ONE", stubX + 8, 48);

  doc.setTextColor(255, 209, 102);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(14);
  doc.text(`T${String(number).padStart(3, "0")}`, stubX + 8, 60);

  // ── Footer
  const now = new Date();
  doc.setTextColor(140, 110, 150);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(8);
  doc.text(`Issued: ${now.toLocaleString()}`, 15, H - 12);
  doc.text("Present this PDF at the entrance.", 15, H - 7);
  doc.text("Enjoy the sun ☀", W - 15, H - 7, { align: "right" });

  // Save
  const safeName = name.replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "_") || "guest";
  doc.save(`Ticket_T${String(number).padStart(3, "0")}_${safeName}.pdf`);
}

/* ─────── REALTIME LISTENER ─────── */
function listen() {
  statusEl.textContent = "Connecting…";
  statusEl.className = "";

  onSnapshot(
    ticketsCol,
    (snap) => {
      const nums = snap.docs.map((d) => d.data().number).filter(Boolean);
      render(nums);
      statusEl.textContent = `🟢 Live · ${new Date().toLocaleTimeString()}`;
      statusEl.className = "online";
    },
    (err) => {
      console.error(err);
      statusEl.textContent = "🔴 Disconnected";
      statusEl.className = "offline";
    }
  );
}

/* ─────── SEED ─────── */
async function seed() {
  const snap = await getDocs(ticketsCol);
  if (snap.size > 0) return;
  const batch = writeBatch(db);
  for (let i = 1; i <= TOTAL; i++) {
    batch.set(doc(db, "tickets", pad(i)), { number: i });
  }
  await batch.commit();
  console.log("Seeded 50 tickets");
}

/* ─────── INIT ─────── */
(async function init() {
  buildGrid();
  try {
    await seed();
    listen();
  } catch (e) {
    console.error(e);
    showToast("Firebase error — check config", "error");
  }
})();
</script>
</body>
</html>
